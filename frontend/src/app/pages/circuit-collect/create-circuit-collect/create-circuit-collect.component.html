<div class="sw-dialog">
  <div class="sw-dialog-head">
    <h3 class="sw-dialog-title">
      {{ id ? 'Modifier le circuit de collecte' : 'Nouveau circuit de collecte' }}
    </h3>
    <button type="button" [mat-dialog-close]="true" class="text-muted hover:text-text cursor-pointer">
      <i class="bi bi-x text-xl"></i>
    </button>
  </div>

  <form [formGroup]="circuitForm" (ngSubmit)="onSubmit()" class="sw-dialog-body" novalidate>

    <div class="sw-grid-2">
      <div class="sw-field">
        <label for="name" class="sw-label">Nom</label>
        <input id="name" type="text" formControlName="name" placeholder="Nom du circuit"
          class="sw-input" />
        @if (submitted && f['name'].invalid) {
          <p class="sw-error">Nom requis.</p>
        }
      </div>

      <div class="sw-field">
        <label for="code" class="sw-label">Code</label>
        <input id="code" type="text" formControlName="code" placeholder="Code du circuit"
          class="sw-input" />
        @if (submitted && f['code'].invalid) {
          <p class="sw-error">Code requis.</p>
        }
      </div>
    </div>

    <div class="sw-field">
      <label for="communeId" class="sw-label">Commune</label>
      <select id="communeId" formControlName="communeId"
        class="sw-input">
        <option [ngValue]="null" disabled>Sélectionner une commune…</option>
        @for (commune of listCommunes; track commune.communeId) {
          <option [ngValue]="commune.communeId">{{ commune.name }}</option>
        }
      </select>
      @if (submitted && f['communeId'].invalid) {
        <p class="sw-error">Commune requise.</p>
      }
    </div>

    <div class="sw-grid-2">
      <div class="sw-field">
        <label for="type" class="sw-label">Type</label>
        <input id="type" type="text" formControlName="type"
          class="sw-input" />
      </div>
      <div class="sw-field">
        <label for="cat" class="sw-label">Catégorie</label>
        <input id="cat" type="text" formControlName="cat"
          class="sw-input" />
      </div>
    </div>

    <div class="sw-grid-3">
      <div class="sw-field">
        <label for="frequency" class="sw-label">Fréquence</label>
        <input id="frequency" type="text" formControlName="frequency"
          class="sw-input" />
      </div>
      <div class="sw-field">
        <label for="rotation" class="sw-label">Rotation</label>
        <input id="rotation" type="text" formControlName="rotation"
          class="sw-input" />
      </div>
      <div class="sw-field">
        <label for="length" class="sw-label">Longueur</label>
        <input id="length" type="text" formControlName="length"
          class="sw-input" />
      </div>
    </div>

    <div class="sw-dialog-foot">
      <button type="button" [mat-dialog-close]="true"
        class="sw-btn-danger">
        Annuler
      </button>
      <button type="submit" [disabled]="saving"
        class="sw-btn-primary">
        {{ saving ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
    </div>
  </form>
</div>
