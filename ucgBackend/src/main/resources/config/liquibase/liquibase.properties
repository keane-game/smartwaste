# Configuration du plugin Maven Liquibase — utilisée seulement pour les commandes manuelles
# (`./mvnw liquibase:status`, `liquibase:diff`). Le schéma applicatif, lui, est appliqué par
# Spring Boot au démarrage (`spring.liquibase.*` dans application.yml) : c'est ce chemin qui fait foi.
#
# ⚠️ AUCUN SECRET ICI. Ce fichier portait `password=keane` — le mot de passe réel de la base de
# développement, versionné (ADR-0002). Il pointait de surcroît une base `sonaged` qui n'existe plus
# (l'application utilise `smartwaste`), donc toute commande le lisant échouait déjà.
#
# Les paramètres de connexion se passent en ligne de commande :
#   ./mvnw liquibase:status \
#       -Dliquibase.url=jdbc:postgresql://localhost:5432/smartwaste \
#       -Dliquibase.username=postgres \
#       -Dliquibase.password="$DB_PASSWORD"
driver=org.postgresql.Driver
changeLogFile=src/main/resources/config/liquibase/master.xml

outputChangeLogFile=src/main/resources/config/liquibase/changelog/1.0.0_schema.xml
# Comparaison schéma <-> entités (`liquibase:diff`).
referenceUrl=hibernate:spring:sonaged.collecte.master.model?dialect=org.hibernate.dialect.PostgreSQLDialect&hibernate.physical_naming_strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy&hibernate.implicit_naming_strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
