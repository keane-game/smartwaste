# =============================================================================
# Configuration SONAGED — fichier UNIQUE (P2-4)
#
# `application.properties` a été fusionné ici puis supprimé. Les deux fichiers coexistaient
# avec des valeurs divergentes (courrier, stratégie de nommage) ; or Spring Boot donne la
# priorité à `application.properties` sur `application.yml`, si bien que la configuration
# réellement appliquée n'était pas celle qu'on lisait dans le `.yml`. Les valeurs retenues
# ci-dessous sont celles qui GAGNAIENT auparavant, afin de ne pas changer le comportement.
#
# Secrets : jamais de valeur en dur — uniquement des placeholders ${VAR:defaut} (ADR-0002).
# =============================================================================

application-description: ''
application-version: ''
project-version: ''

server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: '@project.name@'

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXX

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartwaste}
    username: ${DB_USERNAME:postgres}
    # Aucune valeur par defaut : `keane` etait le mot de passe REEL de la base de developpement,
    # donc un secret versionne (ADR-0002). Le demarrage doit echouer bruyamment si DB_PASSWORD
    # n'est pas fourni — un defaut silencieux invite a l'oublier en production.
    password: ${DB_PASSWORD:keqne}
    driver-class-name: org.postgresql.Driver

  # -------------------------------------------------------------------------
  # Initialisation SQL : DÉSACTIVÉE explicitement.
  #
  # `schema.sql` commence par `DROP DATABASE IF EXISTS sonaged;` — le laisser exécutable
  # détruirait la base au démarrage. L'ancienne configuration le référençait via
  # `spring.datasource.schema` + `initialization-mode: always`, deux propriétés de
  # Spring Boot 1.x qui n'existent plus en Boot 3 : elles étaient donc silencieusement
  # IGNORÉES, et c'est uniquement pour cette raison que la base a survécu. Traduire ces
  # clés vers les noms modernes (`spring.sql.init.*`) aurait effacé la base.
  #
  # Le schéma appartient à Liquibase, et à lui seul (ADR-0001 / P0-4).
  # -------------------------------------------------------------------------
  sql:
    init:
      mode: never

  liquibase:
    change-log: classpath:config/liquibase/master.xml
    enabled: true

  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    hibernate:
      # validate : Liquibase est la source unique du schéma. Ne PAS remettre update/create.
      ddl-auto: validate
      naming:
        # -------------------------------------------------------------------
        # UNE seule stratégie de nommage (P2-4).
        #
        # Les deux fichiers déclaraient auparavant des stratégies CONTRADICTOIRES :
        # `PhysicalNamingStrategyStandardImpl` d'un côté, `SpringPhysicalNamingStrategy`
        # de l'autre. Or le baseline Liquibase nomme les colonnes `depotoirid`,
        # `quartierid`, `createddate` — c'est-à-dire le nom de `@Column` repris tel quel
        # puis replié en minuscules par PostgreSQL. La stratégie « Spring » aurait exigé
        # `depotoir_id` (camelCase -> snake_case) et fait échouer `ddl-auto: validate`
        # au démarrage : c'est l'origine la plus probable de la « dérive » constatée.
        # -------------------------------------------------------------------
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  # Références circulaires INTERDITES (ADR-0009 §4).
  #
  # La tolérance était activée pour masquer un cycle `JwtFilter -> UserService -> JwtService`.
  # Ce cycle n'existe plus : `JwtService` ne dépend que de `UserService` et `UserRepository`, et
  # `UserServiceImpl` ne dépend d'aucun des deux. La ligne avait donc survécu au défaut qu'elle
  # contournait, et continuait à couvrir les cycles suivants — qui, eux, n'auraient été découverts
  # qu'en production.
  #
  # Ne pas remettre `true` pour débloquer un démarrage : ce serait accepter un cycle sans l'avoir vu.
  main:
    allow-circular-references: false

  mail:
    default-encoding: UTF-8
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    # Pour le SMTP de développement (smtp4dev, docker-compose.yml) :
    #   MAIL_HOST=localhost MAIL_PORT=25 + auth/starttls à false.

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:5MB}

security:
  filter:
    active-cors: true
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
      allowed-methods: "*"
      allowed-headers: "*"
      exposed-headers: "Authorization,Link"
      allow-credentials: true
      max-age: 1800
    actorsIps:
      - "127.0.0.1"
      - "192.168.1.4"
      - "10.0.0.0/8"
    swaggerIps:
      - "127.0.0.1"
      - "192.168.1.4"
      - "10.0.0.0/8"

# Configuration applicative SONAGED
sonaged:
  storage:
    # Stockage objet des images/fichiers (P1-3 / ADR-0005) — MinIO, compatible S3.
    # Les fichiers sont envoyés dans le bucket ; seule une référence (clé + URL) est en base.
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:sonaged-images}
      # URL publique de diffusion des objets. Vide -> {endpoint}/{bucket}. Renseigner si proxy/CDN
      # (ou pour des URLs présignées gérées en amont). Le bucket doit être lisible pour un accès direct.
      public-base-url: ${MINIO_PUBLIC_URL:}
  security:
    jwt:
      # Duree de vie du jeton d'acces. Passee de 10 JOURS a 15 minutes : c'est ce que les
      # sessions revocables ont rendu possible, et c'est la moitie du benefice attendu.
      # Un jeton copie n'est plus exploitable que 15 min ; au-dela, il faut le jeton de
      # rafraichissement, lui revocable et tourne a chaque usage.
      # Non regressif : le client Angular renouvelle desormais l'acces de maniere transparente
      # (ErrorInterceptor sur 401 -> POST /auth/refresh -> rejeu de la requete).
      access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}
    session:
      # Au-dela, il faut se reconnecter.
      refresh-ttl-days: ${SESSION_REFRESH_TTL_DAYS:30}
  alerting:
    # ADR-0004 : seuil de declenchement de l'alerte automatique, en % de remplissage.
    # Global pour l'instant ; par type de depotoir a terme (un bac de rue et une caisse
    # polybenne ne se remplissent pas au meme rythme).
    fill-threshold-percent: ${ALERT_FILL_THRESHOLD:80}

  deletion:
    # Soft-delete (toutes entités) : rétention avant purge définitive + fréquence de purge.
    retention-days: ${DELETION_RETENTION_DAYS:30}
    purge-cron: ${DELETION_PURGE_CRON:0 0 3 * * *}   # tous les jours à 03:00
  bootstrap:
    # Amorçage du compte d'administration (ADR-0014 §2).
    # La table `users` est vide depuis les migrations UUID (2.1.0-3 la purge) et aucun chemin ne mène
    # à un compte ADMIN : /auth/register impose USER, et l'activation passe par un code courriel.
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      # AUCUNE valeur par défaut, volontairement : un mot de passe par défaut serait un secret
      # versionné (ADR-0002), figé et partagé par tous les déploiements. Non renseigné = aucun
      # compte créé, et un avertissement explicite au démarrage.
      email: ${SONAGED_ADMIN_EMAIL:}
      password: ${SONAGED_ADMIN_PASSWORD:}
  import:
    # Import automatisé des GeoJSON (P1-5) : datas/*.json -> base (réutilise UploadFileService).
    geojson:
      # Base des fichiers (préfixe file: ou classpath:). Défaut = dossier datas/ du dépôt
      # (résolu relativement au répertoire de lancement : démarrer le backend depuis ucgBackend/).
      location: ${GEOJSON_DIR:file:../datas}
      # Rejouer l'import au démarrage (idempotent, saute les entités déjà peuplées). Défaut false.
      # Déclenchement manuel : POST /v1/admin/import/geojson[?force=true] (authentifié).
      on-startup: ${GEOJSON_IMPORT_ON_STARTUP:false}
  iot:
    # Santé du parc de capteurs (G7 du backlog).
    # Un capteur muet ne déclenchait rien : le point retombait silencieusement en « état inconnu »,
    # ce que la tournée traite bien, mais personne n'apprenait que le capteur était mort.
    silence-threshold-hours: ${IOT_SILENCE_THRESHOLD_HOURS:6}
    silence-check-cron: ${IOT_SILENCE_CHECK_CRON:0 */15 * * * *}
  awareness:
    # Messages de sensibilisation (G3). Le plafond protège le citoyen : une fonction de diffusion
    # de masse est aussi une fonction de nuisance, et qui ne peut pas faire taire l'application la
    # désinstalle — emportant aussi les rappels de collecte, qui eux sont utiles.
    frequency-cap-hours: ${AWARENESS_FREQUENCY_CAP_HOURS:24}
    dispatch-cron: ${AWARENESS_DISPATCH_CRON:0 */5 * * * *}
  alerts:
    # Diffusion temps réel des alertes (P2-1 / ADR-0007).
    stream:
      timeout-ms: ${ALERTS_STREAM_TIMEOUT_MS:1800000}   # 30 min avant expiration d'un flux SSE
      heartbeat-ms: ${ALERTS_STREAM_HEARTBEAT_MS:30000} # ping anti-coupure des proxies

springdoc:
  api-docs:
    path: /sonaged-docs
  enable-data-rest: true
  use-fqn: true

management:
  endpoints:
    web:
      exposure:
        # `health` seul par défaut. `info` a été retiré : springdoc y publie la version et le nom
        # du projet, et l'endpoint est atteignable sans jeton dès lors qu'on l'expose.
        # Élargir uniquement par variable d'environnement, et jamais en production ouverte.
        include: ${ACTUATOR_EXPOSE:health}
  endpoint:
    health:
      # UP/DOWN, rien d'autre. Le détail nomme les composants (base, disque, courrier) et leur
      # état : c'est une carte de la panne offerte à qui la provoque. L'orchestrateur n'a besoin
      # que du verdict.
      show-details: ${ACTUATOR_HEALTH_DETAILS:never}
      probes:
        # Sépare « le processus vit » (liveness) de « il peut servir » (readiness). Pendant les
        # 126 changesets Liquibase du démarrage, le port écoute déjà mais rien n'est servable :
        # sans readiness, un orchestrateur enverrait du trafic dans ce trou.
        enabled: true
  health:
    mail:
      # Désactivé DÉLIBÉRÉMENT, et pas seulement parce que ce contributeur fait échouer le
      # chargement du contexte quand aucun `JavaMailSender` n'est configuré
      # (`'beans' must not be empty`, RegisterAtomicityTest).
      #
      # La raison de fond : la santé rapportée ici décide des redémarrages. Or l'indisponibilité
      # du SMTP n'empêche pas l'API de servir les alertes, les tournées et les cartes — elle
      # n'empêche que l'envoi des codes d'activation. Laisser ce contributeur actif ferait
      # déclarer DOWN, puis redémarrer en boucle, une application parfaitement capable de
      # travailler, à cause d'une dépendance accessoire.
      enabled: false
