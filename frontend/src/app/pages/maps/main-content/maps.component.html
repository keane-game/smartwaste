<div class="flex flex-col gap-3">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="sw-page-title">Carte des points de collecte</h1>
      <p class="text-sm text-muted">
        @if (loading()) {
          Chargement des points…
        } @else {
          {{ pointCount() }} point{{ pointCount() > 1 ? 's' : '' }} géolocalisé{{ pointCount() > 1 ? 's' : '' }}
        }
      </p>
    </div>
  </div>

  <div class="relative rounded-DEFAULT border border-border shadow-lg overflow-hidden" style="height: 70vh;">
    <div #map class="h-full w-full"></div>

    @if (loading()) {
      <div class="absolute inset-0 flex items-center justify-center bg-surface/70 z-[1000]">
        <span class="text-sm text-muted">Chargement de la carte…</span>
      </div>
    }

    <div class="absolute bottom-3 left-3 z-[1000] bg-surface/95 rounded-sm shadow-lg px-3 py-2 text-xs text-text flex flex-col gap-1">
      @for (entry of legend; track entry.label) {
        <div class="flex items-center gap-2">
          <img [src]="entry.icon" alt="" class="h-4 w-4" />
          <span>{{ entry.label }}</span>
        </div>
      }
    </div>
  </div>
</div>
