<div class="sw-dialog">
  <div class="sw-dialog-head">
    <h3 class="sw-dialog-title">
      {{ id ? 'Modifier le quartier' : 'Nouveau quartier' }}
    </h3>
    <button type="button" [mat-dialog-close]="true" class="text-muted hover:text-text cursor-pointer">
      <i class="bi bi-x text-xl"></i>
    </button>
  </div>

  <form [formGroup]="quartierForm" (ngSubmit)="onSubmit()" class="sw-dialog-body" novalidate>

    <div class="sw-grid-2">
      <div class="sw-field">
        <label for="name" class="sw-label">Nom</label>
        <input id="name" type="text" formControlName="name" placeholder="Nom du quartier"
          class="sw-input" />
        @if (submitted && f['name'].invalid) {
          <p class="sw-error">Nom requis.</p>
        }
      </div>

      <div class="sw-field">
        <label for="code" class="sw-label">Code</label>
        <input id="code" type="text" formControlName="code" placeholder="Code du quartier"
          class="sw-input" />
        @if (submitted && f['code'].invalid) {
          <p class="sw-error">Code requis.</p>
        }
      </div>
    </div>

    <div class="sw-field">
      <label for="communeId" class="sw-label">Commune</label>
      <select id="communeId" formControlName="communeId"
        class="sw-input">
        <option [ngValue]="null" disabled>Sélectionner une commune…</option>
        @for (commune of listCommunes; track commune.communeId) {
          <option [ngValue]="commune.communeId">{{ commune.name }}</option>
        }
      </select>
      @if (submitted && f['communeId'].invalid) {
        <p class="sw-error">Commune requise.</p>
      }
    </div>

    <div class="sw-grid-2">
      <div class="sw-field">
        <label for="length" class="sw-label">Longueur</label>
        <input id="length" type="text" formControlName="length"
          class="sw-input" />
      </div>
      <div class="sw-field">
        <label for="area" class="sw-label">Surface</label>
        <input id="area" type="text" formControlName="area"
          class="sw-input" />
      </div>
    </div>

    <div class="sw-field">
      <label for="zoneCoron" class="sw-label">Zone coron</label>
      <input id="zoneCoron" type="text" formControlName="zoneCoron"
        class="sw-input" />
    </div>

    <details class="text-sm">
      <summary class="cursor-pointer text-muted hover:text-text select-none">Champs administratifs avancés</summary>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-gutter-md mt-gutter-sm">
        <div class="sw-field">
          <label for="cav" class="sw-label">CAV</label>
          <input id="cav" type="text" formControlName="cav"
            class="sw-input" />
        </div>
        <div class="sw-field">
          <label for="codeCav" class="sw-label">Code CAV</label>
          <input id="codeCav" type="text" formControlName="codeCav"
            class="sw-input" />
        </div>
        <div class="sw-field">
          <label for="cCrca" class="sw-label">CR/CA</label>
          <input id="cCrca" type="text" formControlName="cCrca"
            class="sw-input" />
        </div>
        <div class="sw-field">
          <label for="codeCcrca" class="sw-label">Code CR/CA</label>
          <input id="codeCcrca" type="text" formControlName="codeCcrca"
            class="sw-input" />
        </div>
        <div class="sw-field">
          <label for="codeEntity" class="sw-label">Code entité</label>
          <input id="codeEntity" type="text" formControlName="codeEntity"
            class="sw-input" />
        </div>
        <div class="sw-field">
          <label for="numerozr" class="sw-label">Numéro ZR</label>
          <input id="numerozr" type="text" formControlName="numerozr"
            class="sw-input" />
        </div>
        <div class="sw-field">
          <label for="codeSzr" class="sw-label">Code SZR</label>
          <input id="codeSzr" type="text" formControlName="codeSzr"
            class="sw-input" />
        </div>
        <div class="sw-field">
          <label for="poucentage" class="sw-label">Pourcentage</label>
          <input id="poucentage" type="text" formControlName="poucentage"
            class="sw-input" />
        </div>
      </div>
    </details>

    <div class="sw-dialog-foot">
      <button type="button" [mat-dialog-close]="true"
        class="sw-btn-danger">
        Annuler
      </button>
      <button type="submit"
        class="sw-btn-primary">
        Enregistrer
      </button>
    </div>
  </form>
</div>
