<div class="signup-wrap">
  <div class="signup-card">

    <header class="signup-head">
      <h1>Créer un compte</h1>
      <p *ngIf="step === 'account'">Renseignez vos informations pour rejoindre la supervision SONAGED.</p>
      <p *ngIf="step === 'activation'">
        Un code d'activation a été envoyé à <strong>{{ registeredEmail }}</strong>. Saisissez-le ci-dessous.
      </p>
    </header>

    <p class="msg error" *ngIf="error">{{ error }}</p>

    <!-- Étape 1 : informations du compte -->
    <form *ngIf="step === 'account'" [formGroup]="form" (ngSubmit)="submitAccount()" novalidate>
      <div class="grid-2">
        <label class="field">
          <span>Prénom <em>*</em></span>
          <input type="text" formControlName="userFirstname" autocomplete="given-name">
          <small class="err" *ngIf="form.get('userFirstname')?.touched && form.get('userFirstname')?.invalid">Prénom requis.</small>
        </label>
        <label class="field">
          <span>Nom <em>*</em></span>
          <input type="text" formControlName="userLastname" autocomplete="family-name">
          <small class="err" *ngIf="form.get('userLastname')?.touched && form.get('userLastname')?.invalid">Nom requis.</small>
        </label>
      </div>

      <label class="field">
        <span>E-mail <em>*</em></span>
        <input type="email" formControlName="userEmail" autocomplete="email">
        <small class="err" *ngIf="form.get('userEmail')?.touched && form.get('userEmail')?.invalid">E-mail valide requis.</small>
      </label>

      <div class="grid-2">
        <label class="field">
          <span>Téléphone</span>
          <input type="tel" formControlName="userPhone" autocomplete="tel">
        </label>
        <label class="field">
          <span>Adresse</span>
          <input type="text" formControlName="userAddress" autocomplete="street-address">
        </label>
      </div>

      <label class="field">
        <span>Mot de passe <em>*</em></span>
        <input type="password" formControlName="userPassword" autocomplete="new-password">
        <small class="err" *ngIf="form.get('userPassword')?.touched && form.get('userPassword')?.invalid">6 caractères minimum.</small>
      </label>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Création…' : 'Créer le compte' }}
      </button>
    </form>

    <!-- Étape 2 : activation -->
    <form *ngIf="step === 'activation'" [formGroup]="activationForm" (ngSubmit)="submitActivation()" novalidate>
      <label class="field">
        <span>Code d'activation <em>*</em></span>
        <input type="text" formControlName="code" inputmode="numeric" autocomplete="one-time-code">
        <small class="err" *ngIf="activationForm.get('code')?.touched && activationForm.get('code')?.invalid">Code requis.</small>
      </label>
      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Activation…' : 'Activer le compte' }}
      </button>
    </form>

    <p class="foot">Déjà inscrit ? <a routerLink="/login">Se connecter</a></p>

  </div>
</div>
