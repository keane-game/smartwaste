<!--
  Les deux menus déroulants « 4 nouvelles notifications » / « 3 nouveaux messages » ont été retirés :
  c'était du contenu de gabarit (Maria Hudson, « Lorem Ipsum », compteurs 4 et 3 en dur) que rien
  n'alimentait, et leurs vignettes `<img src="">` déclenchaient une requête vers la page courante
  plus une image cassée sur CHAQUE écran de l'application. La cloche pointe désormais vers l'écran
  Notifications, qui existe réellement.
-->
<div class="header rectangle flex items-center gap-gutter-md px-gutter-md">
  <div class="custom-menu">
    <button type="button"
      id="sidebarCollapse"
      aria-controls="sidebar"
      aria-label="Afficher ou masquer le menu"
      class="btnt toggle-sidebar-btn"
      (click)="triggerParentFunction()">
      <i class="bi bi-filter-right"></i>
    </button>
  </div>

  <span class="px-4 d-none d-md-block page-title">| {{ pageTitle }}</span>

  <nav class="header-nav ms-auto flex items-center gap-gutter-md">
    <a routerLink="/notifications" class="nav-link nav-icon oval" aria-label="Notifications">
      <i class="bi bi-bell iconnotification"></i>
    </a>

    @if (user()) {
      <div class="profil-name">
        <span class="name">{{ displayName }}</span>
        <span class="profile">{{ displayRole }}</span>
      </div>
    }
  </nav>
</div>
