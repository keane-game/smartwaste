<div class="entity-list">

  <header class="toolbar">
    <h2>Rôles</h2>
    <button type="button" class="btn btn-primary" (click)="openCreate()" *ngIf="!showForm">
      + Nouveau rôle
    </button>
  </header>

  <p class="message" *ngIf="message">{{ message }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <form class="entity-form" *ngIf="showForm" [formGroup]="form" (ngSubmit)="save()">
    <h3>{{ editingId ? 'Modifier le rôle' : 'Nouveau rôle' }}</h3>
    <div class="fields">
      <label>Nom
        <input type="text" formControlName="name" placeholder="ex. ROLE_ADMIN">
        <span class="field-error" *ngIf="f['name'].touched && f['name'].invalid">Nom requis.</span>
      </label>
      <label>Description <input type="text" formControlName="description"></label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
      <button type="button" class="btn btn-ghost" (click)="cancel()">Annuler</button>
    </div>
  </form>

  <p *ngIf="loading">Chargement…</p>

  <table class="grid" *ngIf="!loading">
    <thead>
      <tr>
        <th>#</th>
        <th>Nom</th>
        <th>Description</th>
        <th class="actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of items">
        <td>{{ a.authorityId }}</td>
        <td>{{ a.name }}</td>
        <td>{{ a.description }}</td>
        <td class="actions">
          <button type="button" class="btn btn-ghost" (click)="openEdit(a)">Modifier</button>
          <button type="button" class="btn btn-danger" (click)="remove(a)">Supprimer</button>
        </td>
      </tr>
      <tr *ngIf="items.length === 0">
        <td colspan="4" class="empty">Aucun rôle.</td>
      </tr>
    </tbody>
  </table>

</div>
