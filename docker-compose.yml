# =============================================================================
# Smart Collect / SONAGED — pile de développement et de démonstration.
#
#     docker compose up
#
# Rien d'autre à installer, à créer ni à renseigner : ni base, ni schéma, ni compte, ni
# données. Au premier démarrage, Liquibase joue les 126 changesets, le compte d'administration
# est amorcé et les GeoJSON de Pikine sont importés (71 points de collecte, 12 communes,
# 357 quartiers). L'API répond sur http://localhost:8089/swagger-ui
#
# -----------------------------------------------------------------------------
# ⚠️  IDENTIFIANTS DE DÉVELOPPEMENT — CE FICHIER N'EST PAS UN FICHIER DE PRODUCTION.
#
# Les valeurs par défaut ci-dessous ne sont pas des secrets : elles ne protègent que des
# conteneurs éphémères, sur la machine de l'exécutant, et n'existent nulle part ailleurs.
# Elles sont écrites en clair PARCE QUE la contrainte est « aucune configuration
# supplémentaire » — un fichier `.env` obligatoire ferait échouer `docker compose up` nu.
#
# Chacune reste surchargeable sans modifier ce fichier (forme `${VAR:-défaut}`) :
#
#     DB_PASSWORD=… SONAGED_ADMIN_PASSWORD=… docker compose up
#
# Pour un déploiement réel, ces variables DOIVENT être fournies par l'environnement, et ce
# fichier ne doit pas servir tel quel : il publie les ports d'administration (console MinIO,
# interface smtp4dev) et laisse PostgreSQL joignable depuis l'hôte. Voir ADR-0002 (secrets)
# et ADR-0019 (conteneurisation).
# -----------------------------------------------------------------------------

name: smartwaste

services:

  # --- Base de données ---------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smartwaste}
      POSTGRES_USER: ${DB_USERNAME:-smartwaste}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartwaste-dev}
    ports:
      # Exposé pour permettre l'inspection à la main (psql, DBeaver) pendant une démonstration.
      # 5433 côté hôte : le port 5432 est fréquemment déjà pris par une installation locale, et
      # `application.yml` pointe historiquement sur 5433 hors conteneur.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` seul répond « prêt » pendant la phase d'initialisation, alors que la base
      # applicative n'existe pas encore. On interroge donc la base ET l'utilisateur visés.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-smartwaste} -d ${DB_NAME:-smartwaste}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # --- Stockage objet (images des signalements) --------------------------------------
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # --- Création du bucket ------------------------------------------------------------
  #
  # Conteneur à usage unique : il crée le bucket puis s'arrête. Sans lui, le premier envoi
  # d'image échoue sur un bucket inexistant — une panne qui n'apparaît qu'au moment de la
  # démonstration, et qui ressemble à un défaut applicatif.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-sonaged-images}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set download local/$$MINIO_BUCKET &&
      echo 'bucket ' $$MINIO_BUCKET ' pret'
      "
    restart: "no"

  # --- Serveur de courriel de développement ------------------------------------------
  #
  # Capte les courriels au lieu de les remettre. L'activation de compte passe par un code
  # envoyé par courriel : sans ce service, on ne peut pas terminer une inscription en
  # démonstration. Les messages se lisent sur http://localhost:9081
  smtp4dev:
    image: rnwood/smtp4dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "9081:80"
    volumes:
      - smtp4dev-data:/smtp4dev
    restart: unless-stopped

  # --- API Smart Collect ---------------------------------------------------------------
  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        # `service_completed_successfully` et non `service_started` : le bucket doit exister
        # avant le premier envoi, pas seulement le conteneur qui le crée.
        condition: service_completed_successfully
    environment:
      # Base — le nom d'hôte est celui du service, pas `localhost` : dans un conteneur,
      # `localhost` désigne le conteneur lui-même.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smartwaste}
      DB_USERNAME: ${DB_USERNAME:-smartwaste}
      DB_PASSWORD: ${DB_PASSWORD:-smartwaste-dev}

      # Stockage objet
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-sonaged-images}
      # URL de diffusion vue par le NAVIGATEUR, pas par le conteneur : une image référencée
      # par `http://minio:9000/...` serait introuvable depuis l'hôte, ce nom n'existant que
      # sur le réseau Docker.
      MINIO_PUBLIC_URL: http://localhost:9000/${MINIO_BUCKET:-sonaged-images}

      # Courriel. `application.yml` fixe `auth: true` et STARTTLS en dur ; smtp4dev n'exige ni
      # l'un ni l'autre et refuse la poignée de main. La liaison relâchée de Spring Boot permet
      # de les neutraliser par variables d'environnement, sans toucher au code.
      MAIL_HOST: smtp4dev
      MAIL_PORT: "25"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"

      # Compte d'administration amorcé au démarrage (ADR-0014 §2). Sans lui, la pile démarre
      # mais personne ne peut se connecter : `/auth/register` ne crée que des comptes USER.
      ADMIN_BOOTSTRAP_ENABLED: "true"
      SONAGED_ADMIN_EMAIL: ${SONAGED_ADMIN_EMAIL:-admin@smartcollect.sn}
      SONAGED_ADMIN_PASSWORD: ${SONAGED_ADMIN_PASSWORD:-SmartCollect-dev-2026}

      # Données réelles de Pikine, importées au premier démarrage. C'est ce qui sépare une
      # démonstration crédible d'une base vide. L'import est idempotent : il saute les entités
      # déjà peuplées, donc le rejouer à chaque démarrage ne duplique rien.
      GEOJSON_DIR: file:/app/datas
      GEOJSON_IMPORT_ON_STARTUP: "${GEOJSON_IMPORT_ON_STARTUP:-true}"

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JPA_SHOW_SQL: "false"
    ports:
      - "${SERVER_PORT:-8089}:8089"
    volumes:
      # Lecture seule : l'application importe ces fichiers, elle n'a aucune raison de les
      # modifier, et le dépôt de l'hôte ne doit pas dépendre du conteneur.
      - ./datas:/app/datas:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8089/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Le premier démarrage joue 126 changesets Liquibase puis importe les GeoJSON : la
      # fenêtre de grâce couvre cette phase, sinon le conteneur serait déclaré défaillant
      # alors qu'il travaille normalement.
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  smtp4dev-data:
