


  <div  class="m-3 bg-white">
    <h3 mat-dialog-title class=" p-0 ps-3 p-title">Nouvel Alert</h3>
    <button type="button"  [mat-dialog-close]="true" class=" float-end btn-close-dialog">
      <i class="bi bi-x"></i>
    </button>
    <!-- <hr class="mt-0"> -->
    <!-- <div class="horizontal-line"></div> -->
    <div mat-dialog-content class="row px-0 p-1 no-gutters">
      <div class="forms-style">
  
        <form  [formGroup]="alertForm" class="user-form-container" (ngSubmit)="onSubmit()">
        
          <div class="row gx-3 form-row">
            <div class="col-md sm-pb-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="object"
                formControlName="object"
                placeholder="Votre objet" required >
                <label for="object">Objet</label>
              </div>
            </div>
            <div class="col-md sm-pb-3">
              <div class="form-floating ">
                <select type="text" class="form-select" id="code"
                formControlName="code"
                 placeholder="Code alert" required
                 (change)="selectChange($event) "
                 >
                 <option *ngFor="let code of codes" [value]="code">{{code
                  }}</option>
                  </select>
                <label for="code" class="label-select label_after" style="color: black !important;">Choisir un code</label>
              </div>
            </div>
          </div>
          <div class="row gx-3 form-row">
            <div class="col-md sm-pb-3">
            <div class="custom-file-upload">
              <input type="file" id="file-upload" class="file-input" (change)="onFileSelected($event)">
              <label for="file-upload" class="file-label">
                Choisir une image (optionnel)
              </label><br>
             <span style="color: #5D8B47 !important; font-weight:100 !important; background: #ccc; font-size: small; border-radius:5px ; padding: 0 2px;" bgcolor="grey" size="1" *ngIf="selectedFile">{{ selectedFile.name }}</span> 
            </div>
            </div>
            <div class="col-md sm-pb-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="address"
                formControlName="address"
                placeholder="Adresse de localisation" required >
                <label for="address">Adresse</label>
              </div>
            </div>
          </div>
          <div class="row gx-3 form-row">
            <div class="col-md sm-pb-3">
              <div class="form-floating textarea">
                <textarea type="text" class="form-control" id="message"
                
                formControlName="message"
                placeholder="Votre description" required ></textarea> 
                <label for="message">Description</label>
              </div>
            </div>
          </div>
        
       
        
          <br>
          <div mat-dialog-actions class="float-end p-0">
            <span>
              <button type="button" mat-stroked-button [mat-dialog-close]="true"  class="btn-annuler">
                Annuler
              </button>
              <button type="submit" mat-flat-button class="btn-enregister">
                Enregistrer
              </button>
            </span>
          </div>
        </form>
      </div>
    </div>
  </div>
