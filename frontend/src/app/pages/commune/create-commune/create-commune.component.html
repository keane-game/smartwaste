<div class="sw-dialog">
  <div class="sw-dialog-head">
    <h3 class="sw-dialog-title">
      {{ id ? 'Modifier la commune' : 'Nouvelle commune' }}
    </h3>
    <button type="button" [mat-dialog-close]="true" class="text-muted hover:text-text cursor-pointer">
      <i class="bi bi-x text-xl"></i>
    </button>
  </div>

  <form [formGroup]="communeForm" (ngSubmit)="onSubmit()" class="sw-dialog-body" novalidate>

    <div class="sw-grid-2">
      <div class="sw-field">
        <label for="name" class="sw-label">Nom</label>
        <input id="name" type="text" formControlName="name" placeholder="Nom de la commune"
          class="sw-input" />
        @if (submitted && f['name'].invalid) {
          <p class="sw-error">Nom requis.</p>
        }
      </div>

      <div class="sw-field">
        <label for="code" class="sw-label">Code</label>
        <input id="code" type="text" formControlName="code" placeholder="Code de la commune"
          class="sw-input" />
        @if (submitted && f['code'].invalid) {
          <p class="sw-error">Code requis.</p>
        }
      </div>
    </div>

    <div class="sw-field">
      <label for="departmentId" class="sw-label">Département</label>
      <select id="departmentId" formControlName="departmentId"
        class="sw-input">
        <option [ngValue]="null" disabled>Sélectionner un département…</option>
        @for (department of listDeparts; track department.departmentId) {
          <option [ngValue]="department.departmentId">{{ department.name }}</option>
        }
      </select>
      @if (submitted && f['departmentId'].invalid) {
        <p class="sw-error">Département requis.</p>
      }
    </div>

    <div class="sw-grid-3">
      <div class="sw-field">
        <label for="total" class="sw-label">Habitants</label>
        <input id="total" type="text" formControlName="total"
          class="sw-input" />
      </div>
      <div class="sw-field">
        <label for="women" class="sw-label">Femmes</label>
        <input id="women" type="text" formControlName="women"
          class="sw-input" />
      </div>
      <div class="sw-field">
        <label for="men" class="sw-label">Hommes</label>
        <input id="men" type="text" formControlName="men"
          class="sw-input" />
      </div>
    </div>

    <div class="sw-grid-2">
      <div class="sw-field">
        <label for="length" class="sw-label">Longueur</label>
        <input id="length" type="text" formControlName="length"
          class="sw-input" />
      </div>
      <div class="sw-field">
        <label for="area" class="sw-label">Surface</label>
        <input id="area" type="text" formControlName="area"
          class="sw-input" />
      </div>
    </div>

    <div class="sw-dialog-foot">
      <button type="button" [mat-dialog-close]="true"
        class="sw-btn-danger">
        Annuler
      </button>
      <button type="submit"
        class="sw-btn-primary">
        Enregistrer
      </button>
    </div>
  </form>
</div>
