<div class="bg-surface">
  <div class="flex items-center justify-between px-gutter-lg pt-gutter-lg pb-gutter-sm border-b border-border">
    <h3 class="font-heading text-lg font-semibold text-foreground">
      {{ id ? 'Modifier le quartier' : 'Nouveau quartier' }}
    </h3>
    <button type="button" [mat-dialog-close]="true" class="text-muted hover:text-text cursor-pointer">
      <i class="bi bi-x text-xl"></i>
    </button>
  </div>

  <form [formGroup]="quartierForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-gutter-md p-gutter-lg" novalidate>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-gutter-md">
      <div class="flex flex-col gap-gutter-xs">
        <label for="name" class="text-sm font-medium text-text">Nom</label>
        <input id="name" type="text" formControlName="name" placeholder="Nom du quartier"
          class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        @if (submitted && f['name'].invalid) {
          <p class="text-xs text-destructive">Nom requis.</p>
        }
      </div>

      <div class="flex flex-col gap-gutter-xs">
        <label for="code" class="text-sm font-medium text-text">Code</label>
        <input id="code" type="text" formControlName="code" placeholder="Code du quartier"
          class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        @if (submitted && f['code'].invalid) {
          <p class="text-xs text-destructive">Code requis.</p>
        }
      </div>
    </div>

    <div class="flex flex-col gap-gutter-xs">
      <label for="communeId" class="text-sm font-medium text-text">Commune</label>
      <select id="communeId" formControlName="communeId"
        class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
               focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
        <option [ngValue]="null" disabled>Sélectionner une commune…</option>
        @for (commune of listCommunes; track commune.communeId) {
          <option [ngValue]="commune.communeId">{{ commune.name }}</option>
        }
      </select>
      @if (submitted && f['communeId'].invalid) {
        <p class="text-xs text-destructive">Commune requise.</p>
      }
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-gutter-md">
      <div class="flex flex-col gap-gutter-xs">
        <label for="length" class="text-sm font-medium text-text">Longueur</label>
        <input id="length" type="text" formControlName="length"
          class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
      </div>
      <div class="flex flex-col gap-gutter-xs">
        <label for="area" class="text-sm font-medium text-text">Surface</label>
        <input id="area" type="text" formControlName="area"
          class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
      </div>
    </div>

    <div class="flex flex-col gap-gutter-xs">
      <label for="zoneCoron" class="text-sm font-medium text-text">Zone coron</label>
      <input id="zoneCoron" type="text" formControlName="zoneCoron"
        class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
               focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
    </div>

    <details class="text-sm">
      <summary class="cursor-pointer text-muted hover:text-text select-none">Champs administratifs avancés</summary>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-gutter-md mt-gutter-sm">
        <div class="flex flex-col gap-gutter-xs">
          <label for="cav" class="text-sm font-medium text-text">CAV</label>
          <input id="cav" type="text" formControlName="cav"
            class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                   focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        </div>
        <div class="flex flex-col gap-gutter-xs">
          <label for="codeCav" class="text-sm font-medium text-text">Code CAV</label>
          <input id="codeCav" type="text" formControlName="codeCav"
            class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                   focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        </div>
        <div class="flex flex-col gap-gutter-xs">
          <label for="cCrca" class="text-sm font-medium text-text">CR/CA</label>
          <input id="cCrca" type="text" formControlName="cCrca"
            class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                   focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        </div>
        <div class="flex flex-col gap-gutter-xs">
          <label for="codeCcrca" class="text-sm font-medium text-text">Code CR/CA</label>
          <input id="codeCcrca" type="text" formControlName="codeCcrca"
            class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                   focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        </div>
        <div class="flex flex-col gap-gutter-xs">
          <label for="codeEntity" class="text-sm font-medium text-text">Code entité</label>
          <input id="codeEntity" type="text" formControlName="codeEntity"
            class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                   focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        </div>
        <div class="flex flex-col gap-gutter-xs">
          <label for="numerozr" class="text-sm font-medium text-text">Numéro ZR</label>
          <input id="numerozr" type="text" formControlName="numerozr"
            class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                   focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        </div>
        <div class="flex flex-col gap-gutter-xs">
          <label for="codeSzr" class="text-sm font-medium text-text">Code SZR</label>
          <input id="codeSzr" type="text" formControlName="codeSzr"
            class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                   focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        </div>
        <div class="flex flex-col gap-gutter-xs">
          <label for="poucentage" class="text-sm font-medium text-text">Pourcentage</label>
          <input id="poucentage" type="text" formControlName="poucentage"
            class="w-full rounded-sm border border-border px-3 py-2 text-sm text-text bg-surface
                   focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        </div>
      </div>
    </details>

    <div class="flex justify-end gap-gutter-sm pt-gutter-sm border-t border-border">
      <button type="button" [mat-dialog-close]="true"
        class="rounded-sm border border-border text-text text-sm font-medium px-4 py-2
               hover:bg-muted-surface transition-colors duration-200 cursor-pointer">
        Annuler
      </button>
      <button type="submit"
        class="rounded-DEFAULT bg-primary text-white text-sm font-medium px-4 py-2
               hover:bg-primary-dark transition-colors duration-200 cursor-pointer">
        Enregistrer
      </button>
    </div>
  </form>
</div>
