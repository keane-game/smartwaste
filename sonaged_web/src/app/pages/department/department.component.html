<div class="generalcontainer">
 
    <div class="search-filter">
      <div class="mat-form-field">
        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label style="display: flex; flex-direction: row; justify-content: center;">
            <mat-icon style="font-size: larger; margin-right: 0.5rem;">search</mat-icon>
            Recherche
          </mat-label>
          <input matInput (keyup)="($event)" placeholder="" #input>
        </mat-form-field>
      </div>
      <mat-form-field appearance="outline" style="width: 12%;" mat-stroked-button class="btn-filter" >
        <mat-label>
          <mat-icon style="padding-right: 2rem">filter_list</mat-icon>
          Filter
        </mat-label>
        <mat-select>
          <mat-option value="option1">h</mat-option>
          <mat-option value="option2">n</mat-option>
          <mat-option value="option3">n</mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-flat-button class="add-user-btn"  (click)="OpenCreateDepartModal()"  >Ajouter département</button>
    </div>
        <table mat-table [dataSource]="dataSource" aria-describedby="display departs"
         class="mat-elevation-z0" style="border-top-left-radius: 1.25rem; border-top-right-radius: 1.25rem"
         matSort matSortActive="created" 
         matSortDisableClear matSortDirection="asc"
         (matSortChange)="announceSortChange($event)"
         >
          <ng-container matColumnDef="departmentName">
    
            <th style="border-top-left-radius: 1.25rem" mat-header-cell
             *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name"> Nom 
               <mat-icon type="button" class="swap-sort-header-arrow">swap_vert</mat-icon> </th>
            <td mat-cell *matCellDef="let element"> {{element.departmentName }} </td>
          </ng-container>
    
          <ng-container matColumnDef="departmentCode">
    
            <th mat-header-cell
             *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name"> Code 
               <mat-icon type="button" class="swap-sort-header-arrow">swap_vert</mat-icon> </th>
            <td mat-cell *matCellDef="let element"> {{element.departmentCode }} </td>
          </ng-container>
    
          <ng-container matColumnDef="region">
            <th mat-header-cell *matHeaderCellDef> Rgion </th>
            <td mat-cell *matCellDef="let element"> {{element.region.regionName}} </td>
          </ng-container>
    
          <ng-container matColumnDef="commune">
            <th mat-header-cell *matHeaderCellDef> Communes </th>
            <td mat-cell *matCellDef="let element"> {{element.communes.length}} </td>
          </ng-container>
    
          <ng-container matColumnDef="action">
            <th style="border-top-right-radius: 1.25rem" mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let element">
              <i class="bi bi-pencil-square " (click)="OpenUpdateDepartModal(element.departmentId)"></i>&nbsp;
              <i class="bi bi-trash-fill"  (click)="onDeleteUser(element.departmentId)"></i>
              
            </td>
          </ng-container>
    
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <div class="text-center my-5 lg-text" *ngIf="dataSource?.length <= 0">
            Auncune donnée n'est disponible sur ce tableau
          </div >
      <mat-paginator [hidePageSize]="true" [pageSizeOptions]="[20, 40, 60]"
        style="border: none; display: none;"></mat-paginator>

  </div>
