<section class="section">
  <div class="row">
    <div class="col-lg-5">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ editingId === null ? 'Ajouter un mobilier urbain' : 'Modifier le mobilier urbain' }}</h5>
          <form (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label" for="name">Nom</label>
              <input id="name" class="form-control" [(ngModel)]="form.name" name="name" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="code">Code</label>
              <input id="code" class="form-control" [(ngModel)]="form.code" name="code" required>
            </div>
            <button type="submit" class="btn btn-primary" [disabled]="submitting">
              {{ editingId === null ? 'Créer' : 'Enregistrer' }}
            </button>
            <button type="button" class="btn btn-outline-secondary ms-2" *ngIf="editingId !== null" (click)="cancelEdit()">
              Annuler
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Mobiliers urbains</h5>

          <div *ngIf="loading" class="text-center py-4">
            <span class="spinner-border spinner-border-sm"></span> Chargement…
          </div>

          <div *ngIf="!loading && items.length === 0" class="text-muted py-4">
            Aucun mobilier urbain enregistré.
          </div>

          <table class="table table-borderless" *ngIf="!loading && items.length > 0">
            <thead>
              <tr>
                <th>Nom</th>
                <th>Code</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of items">
                <td>{{ item.name }}</td>
                <td>{{ item.code }}</td>
                <td>
                  <button class="btn btn-sm btn-outline-primary me-1" (click)="startEdit(item)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger" (click)="remove(item)">
                    <i class="bi bi-trash-fill"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>

        </div>
      </div>
    </div>
  </div>
</section>
