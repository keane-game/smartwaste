<div class="entity-list">

  <header class="toolbar">
    <h2>Communes</h2>
    <button type="button" class="btn btn-primary" (click)="openCreate()" *ngIf="!showForm">
      + Nouvelle commune
    </button>
  </header>

  <p class="message" *ngIf="message">{{ message }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <form class="entity-form" *ngIf="showForm" [formGroup]="form" (ngSubmit)="save()">
    <h3>{{ editingId ? 'Modifier la commune' : 'Nouvelle commune' }}</h3>
    <div class="fields">
      <label>
        Nom
        <input type="text" formControlName="name">
        <span class="field-error" *ngIf="f['name'].touched && f['name'].invalid">Nom requis.</span>
      </label>
      <label>
        Code
        <input type="text" formControlName="code">
        <span class="field-error" *ngIf="f['code'].touched && f['code'].invalid">Code requis.</span>
      </label>
      <label>Département
        <select formControlName="department">
          <option [ngValue]="null">— Aucun —</option>
          <option *ngFor="let d of departments" [ngValue]="d">{{ d.name }}</option>
        </select>
      </label>
      <label>Population totale <input type="text" formControlName="total"></label>
      <label>Femmes <input type="text" formControlName="women"></label>
      <label>Hommes <input type="text" formControlName="men"></label>
      <label>Longueur <input type="text" formControlName="length"></label>
      <label>Superficie <input type="text" formControlName="area"></label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
      <button type="button" class="btn btn-ghost" (click)="cancel()">Annuler</button>
    </div>
  </form>

  <p *ngIf="loading">Chargement…</p>

  <table class="grid" *ngIf="!loading">
    <thead>
      <tr>
        <th>#</th>
        <th>Nom</th>
        <th>Code</th>
        <th>Département</th>
        <th>Population</th>
        <th class="actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of items">
        <td>{{ c.communeId }}</td>
        <td>{{ c.name }}</td>
        <td>{{ c.code }}</td>
        <td>{{ c.department?.name }}</td>
        <td>{{ c.total }}</td>
        <td class="actions">
          <button type="button" class="btn btn-ghost" (click)="openEdit(c)">Modifier</button>
          <button type="button" class="btn btn-danger" (click)="remove(c)">Supprimer</button>
        </td>
      </tr>
      <tr *ngIf="items.length === 0">
        <td colspan="6" class="empty">Aucune commune.</td>
      </tr>
    </tbody>
  </table>

</div>
