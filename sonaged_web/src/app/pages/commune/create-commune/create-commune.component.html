
<div  class="m-3 bg-white">
    <h3 mat-dialog-title class=" p-0 ps-3 p-title">Nouvel commune</h3>
    <button type="button"  [mat-dialog-close]="true" class=" float-end btn-close-dialog">
      <i class="bi bi-x"></i>
    </button>
    <!-- <hr class="mt-0"> -->
    <!-- <div class="horizontal-line"></div> -->
    <div mat-dialog-content class="row px-0 p-1 no-gutters">
      <div class="forms-style">
  
        <form  [formGroup]="communeForm" class="user-form-container" (ngSubmit)="onSubmit()">
        
          <div class="row gx-3 form-row">
            <div class="col-md sm-pb-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="nom"
                formControlName="communeName"
                placeholder="Nom commune" required >
                <label for="nom">Nom</label>
              </div>
            </div>
            <div class="col-md sm-pb-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="code"
                formControlName="communeCode"
                 placeholder="Code commune" required>
                <label for="code">Code</label>
              </div>
            </div>
          </div>
          <div class="row gx-3 form-row">
            <div class="col-md sm-pb-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="womanResident"
                formControlName="womanResident"
                placeholder="Nbres de femmes" required >
                <label for="womanResident">Nbre de femmes</label>
              </div>
            </div>
            <div class="col-md sm-pb-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="manResident"
                formControlName="manResident"
                 placeholder="Nbres d'hommes" required>
                <label for="manResident">Nbres d'hommes</label>
              </div>
            </div>
          </div>
          <div class="row gx-3 form-row">
            <div class="col-md sm-pb-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="communeLength"
                formControlName="communeLength"
                placeholder="Longueur de la commune" required >
                <label for="communeLength">Longueur </label>
              </div>
            </div>
            <div class="col-md sm-pb-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="communeArea"
                formControlName="communeArea"
                 placeholder="Surface de la commune" required>
                <label for="communeArea">Surface</label>
              </div>
            </div>
          </div>

          <div class="row gx-3"> 
            <div class="col-md sm-pb-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="totalResident"
                formControlName="totalResident"
                 placeholder="[78, 89]" >
                <label for="geometry">Géometrie</label>
              </div>
            </div> 
            <div class="col-md sm-pb-3">
              <div class="form-floating">
                
              <label for="department" class="label-Depart" >Département</label>
                <ng-multiselect-dropdown
                formControlName="department"
                required="true"
                placeholder=""
                id="department"
                [settings]="dpartSettings"
                [data]="listDeparts"
                (onSelect)="onItemSelectDepart($event)"
                (onDropDownClose)="onDropDownCloseDepart()"
                (onDeSelect)="onItemDeSelectDepart($event)"
                >
                
              </ng-multiselect-dropdown>
              </div>
            </div>
          </div>
            <!-- 
            <div class="col-md-6 sm-pb-3">
              <div class="form-floating">
                <label for="projet" class="label-projet">Project</label>
                  <ng-multiselect-dropdown
                  formControlName="projects"
                  required="true"
                  [placeholder]="''"
                  id="projet"
                  [settings]="projetSettings"
                  [data]="listProjets"
                  (onSelect)="onItemSelectProjet($event)"
                  (onDropDownClose)="onDropDownCloseProjet()"
                  (onDeSelect)="onItemDeSelectProjet($event)"
                  >
                  
                </ng-multiselect-dropdown>
            </div>
            </div>
          </div> -->
        
          <br>
          <div mat-dialog-actions class="float-end p-0">
            <span>
              <button type="button" mat-stroked-button [mat-dialog-close]="true"  class="btn-annuler">
                Annuler
              </button>
              <button type="submit" mat-flat-button class="btn-enregister">
                Enregistrer
              </button>
            </span>
          </div>
        </form>
      </div>
    </div>
  </div>
