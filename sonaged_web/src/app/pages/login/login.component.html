<section class="content-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-12 col-lg-9">
          <div class="wrap d-md-flex">
            <div class="col-md-6 d-none d-md-block">
              <img [src]="imageUrl" class="img-fluid" style="height:100%;" alt=""/>
            </div>
            <div class="login-wrap p-4 p-md-5 col-md-6">
              <span class="fs-2 fw-bold">Connexion</span>
              <br>
              <div class="pt-3 pb3">
                <p>
                  Veuillez renseigner votre e-mail<br> 
                  et votre mot de passe.
                </p>
              </div>
              <form (ngSubmit)="onSubmit(f)" #f="ngForm" novalidate>
                <div class="form-group mb-3">
                  <label class="label" for="username">Adresse mail</label>
                  <input type="text" id="username" class="form-control" name="username"
                  
                  [(ngModel)]="form.username" required minlength="6" #username="ngModel" 
                    [ngClass]="{'input-error': errorFields.username, 'input-normal': !errorFields.username}"
                    (focus)="onFocus('username')"
                    />
                  <div class=" alert-u" role="alert" *ngIf="f.submitted && username.invalid">
                    <span *ngIf="username.errors?.['required']">E-mail requis!</span>
                    <!-- <span *ngIf="username.errors?.['minlength']">L'e-mail doit contenir au moins 6 caractères</span> -->
                  </div>
                </div>
                <div class="form-group mb-3">
                  <label class="label" for="password">Mot de passe</label>
                  <input type="password" id="password" class="form-control" name="password"
                    [(ngModel)]="form.password" required minlength="5" #password="ngModel"

                    [ngClass]="{'input-error': errorFields.password, 'input-normal': !errorFields.password}"
                  (focus)="onFocus('password')"
                    />
                  <div class="alert-p" role="alert" *ngIf="f.submitted && password.invalid">
                    <span *ngIf="password.errors?.['required']">Mot de passe requis</span>
                    <!-- <span *ngIf="password.errors?.['minlength']">Le mot de passe  au moins 5 caractères</span> -->
                  </div>
                </div>
                <div class="form-group d-flex mb-3">
                  <div class="w-75 text-left">
                    <label class="checkbox-wrap checkbox-primary mb-0">Garder la session
                    <input type="checkbox">
                    <span class="checkmark"></span>
                    </label>
                  </div>
                  <div class="w-50 text-md-right ">
                    <a href="#" class="float-end">Mot de passe oublié?</a>
                  </div>
                </div>
                <div class="form-group">
                  <button type="submit" class="form-control btn-submit btn btn-primary rounded submit px-3" [disabled]="isLoading">
                    <span *ngIf="!isLoading">Connexion</span>
                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                  </button>
                </div>
                <div class="w-100 text-md-right mb-4 mt-2">
                  <a href="#" class="float-start d-none">Mot de passe oublié?</a>
                </div>
              </form>
              <!-- <div *ngIf="errorMessage" class="alert alert-danger alert-error">{{ errorMessage }}</div> -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
