# Profil `keycloak` — INACTIF par défaut (activer avec -Dspring.profiles.active=keycloak).
# P0-A / ADR-0011 : le backend devient un OAuth2 Resource Server validant les tokens Keycloak.
# Tant que ce profil n'est pas actif et que l'issuer-uri n'est pas renseigné, l'auto-config
# resource-server reste inerte et l'authentification JWT maison actuelle continue de fonctionner.

# URL du realm Keycloak (émetteur des tokens). Ex. http://localhost:8080/realms/sonaged
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:}

# (Optionnel) endpoint JWKS explicite si l'issuer n'est pas résolvable automatiquement
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:}

# NB : à l'activation, il faut aussi désactiver la SecurityConfiguration JWT maison
# et brancher KeycloakResourceServerConfig (voir docs/keycloak-migration.md).
