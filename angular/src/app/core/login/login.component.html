<div class="container">
    <div class="content no-guetters">
      <div class="col-md-7 d-none d-md-block px-0 loginImg">
        <img
          src="../../../assets/images/loginImg1.png"
          alt="login Img"
          class="img-fluid"
        />
      </div>
      <div class="col-md-5">
        <form class="login-form" (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
          <h1 class="app-name">Connexion</h1>
          <p>Veuillez renseigner votre e-mail et votre mot de passe</p>

          <div class="alert-p" role="alert" *ngIf="isLoginFailed">
            E-mail ou mot de passe incorrect.
          </div>

          <div class="form-input">
            <input
              type="email"
              placeholder="E-mail"
              class="form-control"
              name="username"
              [(ngModel)]="form.username"
              required
              #username="ngModel"
            />
            <span
              class="alert-u"
              role="alert"
              *ngIf="f.submitted && username.invalid"
            >
              L'e-mail est requis.
            </span>
          </div>
          <div class="form-input">
            <input
              type="password"
              placeholder="Mot de passe"
              class="form-control"
              name="password"
              [(ngModel)]="form.password"
              required
              minlength="5"
              #password="ngModel"
            />
            <div
              class="alert-p"
              role="alert"
              *ngIf="f.submitted && password.invalid"
            >
              <span *ngIf="password.errors?.['required']"
                >Le mot de passe est requis.</span
              >
              <span *ngIf="password.errors?.['minlength']">
                Le mot de passe doit contenir au moins 5 caractères.
              </span>
            </div>
          </div>
          <button class="btn btn- w-100">Se connecter</button>
          <a href="#" class="text-sm">Mot de passe oublié ?</a>
          <p class="text-sm mt-2">Pas encore de compte ? <a routerLink="/signup">Créer un compte</a></p>
        </form>
      </div>
    </div>
</div>
