<div class="dashboard">

  <header class="dash-head">
    <div>
      <h1>Supervision — Gestion des déchets</h1>
      <p class="sub">Indicateurs du dispositif de collecte (Pikine).</p>
    </div>
    <button type="button" class="btn-refresh" (click)="loadState()" [disabled]="loading">
      <i class="bi bi-arrow-clockwise"></i> Actualiser
    </button>
  </header>

  <p class="error" *ngIf="error">{{ error }}</p>

  <!-- Squelettes pendant le chargement -->
  <div class="stat-grid" *ngIf="loading">
    <div class="stat-card skeleton" *ngFor="let c of cards"></div>
  </div>

  <!-- Indicateurs réels (GET /data/departmentState) -->
  <div class="stat-grid" *ngIf="!loading && !error">
    <div class="stat-card" *ngFor="let c of cards">
      <div class="stat-icon"><i class="bi" [ngClass]="c.icon"></i></div>
      <div class="stat-body">
        <span class="stat-value">{{ (state[c.key] ?? 0) | number }}</span>
        <span class="stat-label">{{ c.label }}</span>
        <span class="stat-hint">{{ c.hint }}</span>
      </div>
    </div>
  </div>

</div>
