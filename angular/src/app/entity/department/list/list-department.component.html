<div class="entity-list">

  <header class="toolbar">
    <h2>Départements</h2>
    <button type="button" class="btn btn-primary" (click)="openCreate()" *ngIf="!showForm">
      + Nouveau département
    </button>
  </header>

  <p class="message" *ngIf="message">{{ message }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <!-- Formulaire création / édition -->
  <form class="entity-form" *ngIf="showForm" [formGroup]="form" (ngSubmit)="save()">
    <h3>{{ editingId ? 'Modifier le département' : 'Nouveau département' }}</h3>
    <div class="fields">
      <label>
        Nom
        <input type="text" formControlName="name" placeholder="Nom du département">
        <span class="field-error" *ngIf="f['name'].touched && f['name'].invalid">Nom requis.</span>
      </label>
      <label>
        Code
        <input type="text" formControlName="code" placeholder="Code">
        <span class="field-error" *ngIf="f['code'].touched && f['code'].invalid">Code requis.</span>
      </label>
      <label>
        Région
        <select formControlName="region">
          <option [ngValue]="null">— Aucune —</option>
          <option *ngFor="let r of regions" [ngValue]="r">{{ r.name }}</option>
        </select>
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
      <button type="button" class="btn btn-ghost" (click)="cancel()">Annuler</button>
    </div>
  </form>

  <p *ngIf="loading">Chargement…</p>

  <table class="grid" *ngIf="!loading">
    <thead>
      <tr>
        <th>#</th>
        <th>Nom</th>
        <th>Code</th>
        <th>Région</th>
        <th class="actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of items">
        <td>{{ d.departmentId }}</td>
        <td>{{ d.name }}</td>
        <td>{{ d.code }}</td>
        <td>{{ d.region?.name }}</td>
        <td class="actions">
          <button type="button" class="btn btn-ghost" (click)="openEdit(d)">Modifier</button>
          <button type="button" class="btn btn-danger" (click)="remove(d)">Supprimer</button>
        </td>
      </tr>
      <tr *ngIf="items.length === 0">
        <td colspan="5" class="empty">Aucun département.</td>
      </tr>
    </tbody>
  </table>

</div>
