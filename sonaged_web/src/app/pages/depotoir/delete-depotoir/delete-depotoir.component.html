<div  class="m-3 bg-white">
    <div class="delete-section">
      <div mat-dialog-content class="row px-0 p-1 no-gutters">
        
        <p>
          {{ "MODAL.KPI.DELETE-MESSAGE" | translate }}
        </p>
        
      </div>
      <div mat-dialog-actions class="center p-0">
          <span>
            <button type="button" mat-flat-button [mat-dialog-close]="true" class="btn-annuler">
              {{ "MODAL.NONE" | translate }}
            </button>
            <button type="submit" mat-stroked-button mat-dialog-close class="btn-enregister"
            (click)="onSubmit()">
              {{ "MODAL.OK" | translate }}
            </button>
          </span>
      </div>
    </div>
  </div>
