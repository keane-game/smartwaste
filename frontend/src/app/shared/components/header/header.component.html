<!--
  En-tête d'après les maquettes de référence (frontend/mockup) : titre de page à gauche, et à
  droite une cloche en pastille ronde puis l'avatar + le nom de l'utilisateur. Les deux menus
  déroulants « 4 nouvelles notifications » / « 3 nouveaux messages » d'origine étaient du contenu
  de gabarit (noms fictifs, compteurs en dur) que rien n'alimentait, et leurs vignettes
  `<img src="">` déclenchaient une image cassée sur chaque écran : la cloche pointe désormais vers
  l'écran Notifications, qui existe réellement.
-->
<div class="header flex items-center gap-gutter-md px-gutter-lg">
  <button type="button"
    id="sidebarCollapse"
    aria-controls="sidebar"
    aria-label="Afficher ou masquer le menu"
    class="toggle-sidebar-btn flex items-center justify-center h-9 w-9 rounded-pill
           text-text hover:bg-muted-surface transition-colors duration-150 cursor-pointer"
    (click)="triggerParentFunction()">
    <i class="bi bi-list text-xl"></i>
  </button>

  <span class="page-title font-heading text-lg font-semibold text-foreground truncate">{{ pageTitle }}</span>

  <div class="ms-auto flex items-center gap-gutter-sm">
    <a routerLink="/notifications" aria-label="Notifications"
      class="flex items-center justify-center h-9 w-9 rounded-pill bg-muted-surface text-text
             hover:bg-border transition-colors duration-150">
      <i class="bi bi-bell text-base"></i>
    </a>

    @if (user()) {
      <div class="flex items-center gap-gutter-sm">
        <span class="flex items-center justify-center h-9 w-9 rounded-pill bg-muted-surface
                     text-xs font-semibold text-foreground">{{ initials }}</span>
        <div class="hidden sm:flex flex-col leading-tight">
          <span class="text-sm font-medium text-foreground">{{ displayName }}</span>
          <span class="text-xs text-muted">{{ displayRole }}</span>
        </div>
      </div>
    }
  </div>
</div>
