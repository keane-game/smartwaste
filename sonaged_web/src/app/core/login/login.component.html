<section class="content-section">
  <div class="container">
   
    <div class="row justify-content-center">
      <div class="col-md-12 col-lg-9">
        <div class="wrap d-md-flex">
          <div class="col-md-6 d-none d-md-block">
            <img [src]="imageUrl" class="img-fluid" style="height:100%;" alt=""/>
          </div>
          <div class="login-wrap p-4 p-md-5 col-md-6">
              <span class="fs-2 fw-bold">Connexion</span>
              <br>
              <div class="pt-3 pb3">
                <p>
                  Veuillez renseigner votre e-mail<br> 
                  et votre mot de passe.
                </p>
              </div>

            <form action="#" class="signin-form" (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
             
              <div class="form-group mb-3">
                <label class="label" for="name">Adresse mail</label>
                <input type="text" placeholder="exemple@sonaged.sn" class="form-control" name="username"
                    [(ngModel)]="form.username" required minlength="6" #username="ngModel" />
                <span class="alert-u " role="alert" *ngIf="f.submitted && username.valid">
                    E-mail requis!
                </span>
              </div>
              <div class="form-group mb-3">
                <label class="label" for="password">Mot de passe</label>
                <input type="password" placeholder="*********" class="form-control" name="password"
                [(ngModel)]="form.password" required minlength="5" #password="ngModel" />
                <div class="alert-p " role="alert" *ngIf="f.submitted && password.invalid">
                    <span *ngIf="password.errors?.['required']">Mot de passe requis</span>
                    <!-- <span *ngIf="password.errors?.['minlength']">
                        Password must be at least 5 characters
                    </span> -->
                </div>
              </div>
              <div class="form-group d-flex mb-3">
                <div class="w-75 text-left">
                  <label class="checkbox-wrap checkbox-primary mb-0">Garder la session
                  <input type="checkbox">
                  <span class="checkmark"></span>
                  </label>
                </div>
                <div class="w-50 text-md-right ">
                  <a href="#" class="float-end">Mot de passe oublié?</a>
                </div>
              </div>
              <div class="form-group">
                <button type="submit" class="form-control btn-submit btn btn-primary rounded submit px-3">Connexion</button>
              </div>
              <div class="w-100 text-md-right mb-4 mt-2">
                <a href="#" class="float-start d-none">Mot de passe oublié?</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
