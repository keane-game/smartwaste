application-description: ''
application-version: ''
project-version: ''

management:
  endpoints:
    web:
      exposure:
        include: "*"
 
server:
  port: 8089

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sonaged
    driver-class-name: org.postgresql.Driver
    password: keane
    username: postgres
    initialization-mode: always
    schema: classpath:schema.sql

  liquibase:
    change-log: classpath:config/liquibase/master.xml
    enabled: false
    default-schema: sonaged

  jpa:
    hibernate:
      ddl-auto: create
      naming:
        #physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        physical_naming_strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        implicit_naming_strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: true
  batch:
    initialize-schema: always
  mail:
    default-encoding: UTF-8
    host: smtp.gmail.com
    password: '********************'
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    username: nadhem.belhadj.abdallah@gmail.com
  main:
    allow-circular-references: true
springdoc:
  api-docs:
    path: /sonaged-docs
  enable-data-rest: true
  use-fqn: true