<div>
    <div class="search-filter">
        <div class="mat-form-field">
          <mat-form-field appearance="outline" style="width: 100%;">
            <mat-label style="display: flex; flex-direction: row; justify-content: center;">
              <mat-icon style="font-size: larger; margin-right: 0.5rem;">search</mat-icon>
              Recherche
            </mat-label>
            <input matInput (keyup)="($event)" placeholder="" #input>
          </mat-form-field>
        </div>
        <mat-form-field appearance="outline" style="width: 12%;" mat-stroked-button class="btn-filter" >
          <mat-label>
            <mat-icon style="padding-right: 2rem">filter_list</mat-icon>
            Filter
          </mat-label>
          <mat-select>
            <mat-option value="option1">h</mat-option>
            <mat-option value="option2">n</mat-option>
            <mat-option value="option3">n</mat-option>
          </mat-select>
        </mat-form-field>
        <button mat-flat-button class="add-user-btn"  (click)="openCreateAlertModal()"  >Ajouter Alert</button>
    </div>
    <div class="text-center my-5 lg-text" *ngIf="!totalAlerts">
      Auncune donnée n'est disponible sur ce tableau
   </div >
   <div *ngIf="totalAlerts">
    
    <table mat-table [dataSource]="dataSource" aria-describedby="display departs"
    class="mat-elevation-z0" style="border-top-left-radius: 1.25rem; border-top-right-radius: 1.25rem"
    matSort matSortActive="created" 
    matSortDisableClear matSortDirection="asc"
    (matSortChange)="announceSortChange($event)">
    <ng-container matColumnDef="picture">
        <th style="border-top-left-radius: 1.25rem" mat-header-cell *matHeaderCellDef>Image </th>

        <td mat-cell *matCellDef="let element"  (mousemove)="onMouseMove($event, element)"
        (mouseleave)="onMouseLeave($event, element)" > 
        <img class=" rounded zoom-image" *ngIf="element.image"
        [ngStyle]="zoomStyle" style="width: 40px;height: 40px;object-fit: cover;" 
        [src]="'data:image/png;base64,'+element.image?.data" 
        alt="Title"/>
        <span  *ngIf="!element.image">####</span>
       </td>
    </ng-container>
    
     <ng-container matColumnDef="object">
       <th mat-header-cell
        *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name"> Objet 
          <mat-icon type="button" class="swap-sort-header-arrow">swap_vert</mat-icon> </th>
       <td mat-cell *matCellDef="let element"> {{ element.object }} </td>
     </ng-container>

     <ng-container matColumnDef="message">
       <th mat-header-cell
        *matHeaderCellDef mat-sort-header > Description 
          </th>
       <td mat-cell *matCellDef="let element"> {{element.message }} </td>
     </ng-container>

     <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef>Code alert </th>
      <td mat-cell *matCellDef="let element"> {{element.code}} </td>
    </ng-container>

     <ng-container matColumnDef="adress">
       <th mat-header-cell *matHeaderCellDef> Adresse </th>
       <td mat-cell *matCellDef="let element"> {{element?.address}} </td>
     </ng-container>

     <ng-container matColumnDef="action">
       <th style="border-top-right-radius: 1.25rem" mat-header-cell *matHeaderCellDef> Actions </th>
       <td mat-cell *matCellDef="let element">
         <i class="bi bi-pencil-square " (click)="openUpdateAlertModal(element.alertId)"></i>&nbsp;
         <i class="bi bi-trash-fill"  (click)="openDeleteAlertModal(element.alertId)"></i>
       </td>
     </ng-container>

     <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
     <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <app-pagination-custumer 
    [length]="totalAlerts"
    [pageSize]="itemsPerPage"
    [pageSizeOptions]="pageSizeOptions"
    [totalPages]="totalPages"
    (pageChange)="onPaginatedChange($event)">
    </app-pagination-custumer>
  </div>
</div>
