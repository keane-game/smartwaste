<div class="flex flex-col gap-gutter-md">
  <div class="flex items-center justify-between flex-wrap gap-gutter-sm">
    <div class="relative w-full max-w-xs">
      <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-muted text-sm"></i>
      <input
        type="text"
        (keyup)="applyFilter($event)"
        placeholder="Rechercher une alerte…"
        class="w-full rounded-sm border border-border pl-9 pr-3 py-2 text-sm text-text bg-surface
               focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary"
      />
    </div>
    <button
      type="button"
      (click)="openCreateAlertModal()"
      class="rounded-DEFAULT bg-primary text-white text-sm font-medium px-4 py-2
             hover:bg-primary-dark transition-colors duration-200 cursor-pointer"
    >
      + Ajouter alerte
    </button>
  </div>

  <div class="bg-surface border border-border rounded-DEFAULT shadow-lg overflow-x-auto">
    <table mat-table [dataSource]="dataSource" aria-describedby="liste des alertes"
      class="w-full"
      matSort matSortActive="created"
      matSortDisableClear matSortDirection="asc"
      (matSortChange)="announceSortChange($event)"
    >
      <ng-container matColumnDef="picture">
        <th mat-header-cell *matHeaderCellDef
          class="!bg-muted-surface !text-xs !font-semibold !text-muted !uppercase !tracking-wide">
          Image
        </th>
        <td mat-cell *matCellDef="let element" class="!text-sm">
          @if (element.image?.data) {
            <img
              [src]="'data:image/png;base64,' + element.image.data"
              alt="Photo de l'alerte"
              (click)="openZoom(element)"
              class="h-10 w-10 rounded-sm object-cover cursor-zoom-in hover:ring-2 hover:ring-primary/40"
            />
          } @else {
            <span class="text-muted">—</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="object">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Trier par objet"
          class="!bg-muted-surface !text-xs !font-semibold !text-muted !uppercase !tracking-wide">
          Objet
        </th>
        <td mat-cell *matCellDef="let element" class="!text-sm !text-text"> {{ element.object }} </td>
      </ng-container>

      <ng-container matColumnDef="message">
        <th mat-header-cell *matHeaderCellDef
          class="!bg-muted-surface !text-xs !font-semibold !text-muted !uppercase !tracking-wide">
          Description
        </th>
        <td mat-cell *matCellDef="let element" class="!text-sm !text-text !max-w-xs !truncate"
          [title]="element.message"> {{ element.message }} </td>
      </ng-container>

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef
          class="!bg-muted-surface !text-xs !font-semibold !text-muted !uppercase !tracking-wide">
          Gravité
        </th>
        <td mat-cell *matCellDef="let element" class="!text-sm">
          <span class="inline-block rounded-sm px-2 py-0.5 text-xs font-medium" [class]="codeClasses(element.code)">
            {{ element.code }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="adress">
        <th mat-header-cell *matHeaderCellDef
          class="!bg-muted-surface !text-xs !font-semibold !text-muted !uppercase !tracking-wide">
          Adresse
        </th>
        <td mat-cell *matCellDef="let element" class="!text-sm !text-text"> {{ element?.address }} </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef
          class="!bg-muted-surface !text-xs !font-semibold !text-muted !uppercase !tracking-wide">
          Actions
        </th>
        <td mat-cell *matCellDef="let element" class="!text-sm">
          <button type="button" (click)="openUpdateAlertModal(element.alertId)"
            class="text-muted hover:text-primary cursor-pointer mr-3" title="Modifier">
            <i class="bi bi-pencil-square"></i>
          </button>
          <button type="button" (click)="openDeleteAlertModal(element.alertId)"
            class="text-muted hover:text-destructive cursor-pointer" title="Supprimer">
            <i class="bi bi-trash-fill"></i>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:!bg-muted-surface"></tr>
    </table>

    @if (totalAlerts <= 0) {
      <div class="text-center py-gutter-xl text-sm text-muted">
        Aucune alerte n'est disponible.
      </div>
    }

    <div class="border-t border-border">
      <app-pagination-custumer
        [length]="totalAlerts"
        [pageSize]="itemsPerPage"
        [pageSizeOptions]="pageSizeOptions"
        [totalPages]="totalPages"
        (pageChange)="onPaginatedChange($event)">
      </app-pagination-custumer>
    </div>
  </div>
</div>

@if (zoomedImage) {
  <div
    class="fixed inset-0 z-[2000] flex items-center justify-center bg-black/70 cursor-zoom-out p-gutter-lg"
    (click)="closeZoom()"
  >
    <img [src]="zoomedImage" alt="Photo de l'alerte agrandie" class="max-h-full max-w-full rounded-DEFAULT shadow-lg" />
  </div>
}
